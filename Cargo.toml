[package]
name = "airpodsd"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
bluer = { version = "0.17.4", features = ["full"] }
bytes = "1.11.0"
clap = "4.5.54"
env_logger = "0.11.8"
futures = { version = "0.3.31", default-features = false, features = ["std", "async-await"] }
libbluetooth = "0.1.0"
libc = "0.2.180"
log = { version = "0.4.29", features = ["std"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.49.0", features = ["full"] }
zbus = { version = "5.13.2", features = ["tokio"] }
